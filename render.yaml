# Render Blueprint: one click creates the Postgres database and the Amply web service.
# Render dashboard → New → Blueprint → pick this repo.
databases:
  - name: amply-db
    plan: free
    region: singapore
    databaseName: amply
    user: amply

services:
  - type: web
    name: amply
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amply-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      # Optional. Leave empty for offline assistant / mock payments.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
