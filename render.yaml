# Render Blueprint for the Amply web service.
# Render dashboard → New → Blueprint → pick this repo.
# The database lives outside Render (e.g. Neon, free, with PostGIS): paste its connection string
# as DATABASE_URL when Render asks. The app enables PostGIS and loads demo data on first start.
services:
  - type: web
    name: amply
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      # Optional. Leave empty for offline assistant / mock payments.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
