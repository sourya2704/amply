# Local Postgres + PostGIS for development and tests.
#   docker compose up -d db
#   DATABASE_URL=postgres://amply:amply@localhost:5434/amply?sslmode=disable
#   TEST_DATABASE_URL=postgres://amply:amply@localhost:5434/amply_test?sslmode=disable
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: amply-db
    environment:
      POSTGRES_USER: amply
      POSTGRES_PASSWORD: amply
      POSTGRES_DB: amply
    ports:
      - "5434:5432"
    volumes:
      - amply-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/20-amply-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amply"]
      interval: 2s
      retries: 30
volumes:
  amply-db:
